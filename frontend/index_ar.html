<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Legends AR Showcase</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Loading Screen */
#loading{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    font-size:20px;
}

/* Petunjuk Scan */
#scan-info{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:450px;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:12px;
    border-radius:12px;
    text-align:center;
    z-index:9999;
    font-size:14px;
    backdrop-filter:blur(5px);
}

/* Panel Hero */
#hero-info{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    background:rgba(0,0,0,0.85);
    color:white;
    padding:16px;
    border-radius:15px;
    display:none;
    z-index:9999;
    box-sizing:border-box;
    backdrop-filter:blur(10px);
    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

#hero-name{
    font-size:clamp(20px,5vw,24px);
    font-weight:bold;
    color:#FFD700;
    margin-bottom:6px;
}

#hero-role{
    font-size:clamp(12px,3vw,14px);
    color:#cccccc;
    margin-bottom:10px;
}

#hero-desc{
    font-size:clamp(13px,3.5vw,15px);
    line-height:1.6;
}

@media (max-width:600px){

    #hero-info{
        bottom:15px;
        padding:14px;
    }

    #scan-info{
        top:10px;
        font-size:13px;
    }

}

</style>

</head>

<body>

<div id="loading">
Memuat AR...
</div>

<div id="scan-info">
📷 Arahkan kamera ke kartu hero untuk melihat model 3D dan informasi karakter.
</div>

<div id="hero-info">
    <div id="hero-name"></div>
    <div id="hero-role"></div>
    <div id="hero-desc"></div>
</div>

<a-scene
mindar-image="imageTargetSrc: ../assets/targets/all-targets.mind;"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item id="laylaModel"
src="../assets/models/layla.glb"></a-asset-item>

<a-asset-item id="freyaModel"
src="../assets/models/freya.glb"></a-asset-item>

<a-asset-item id="rafaelaModel"
src="../assets/models/rafaela.glb"></a-asset-item>

<audio id="laylaAudio"
src="../assets/audio/layla sound.mpeg"></audio>

<audio id="freyaAudio"
src="../assets/audio/freya sound.mpeg"></audio>

<audio id="rafaelaAudio"
src="../assets/audio/rafaela sound.mpeg"></audio>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false"> </a-camera>

<!-- FREYA -->

<a-entity
id="freyaTarget"
mindar-image-target="targetIndex:0">

<a-gltf-model
src="#freyaModel"
position="0 0 0"
scale="0.5 0.5 0.5"
smooth-rotate>
</a-gltf-model>

</a-entity>

<!-- LAYLA -->

<a-entity
id="laylaTarget"
mindar-image-target="targetIndex:1">

<a-gltf-model
src="#laylaModel"
position="0 0 0"
scale="0.5 0.5 0.5"
smooth-rotate>
</a-gltf-model>

</a-entity>

<!-- RAFAELA -->

<a-entity
id="rafaelaTarget"
mindar-image-target="targetIndex:2">

<a-gltf-model
src="#rafaelaModel"
position="0 0 0"
scale="0.5 0.5 0.5"
smooth-rotate>
</a-gltf-model>

</a-entity>

</a-scene>

<script>

    AFRAME.registerComponent('smooth-rotate', {
    tick: function (time, deltaTime) {
        this.el.object3D.rotation.y += deltaTime * 0.0003;
    }
});

window.addEventListener("load",()=>{

document.getElementById("loading").style.display="none";

const heroInfo = document.getElementById("hero-info");
const heroName = document.getElementById("hero-name");
const heroRole = document.getElementById("hero-role");
const heroDesc = document.getElementById("hero-desc");

function showHero(name, role, desc){

    heroName.textContent = name;
    heroRole.textContent = role;
    heroDesc.textContent = desc;

    heroInfo.style.display = "block";

    document.getElementById("scan-info").style.display = "none";
}

function hideHero(){

    heroInfo.style.display = "none";

    document.getElementById("scan-info").style.display = "block";
}

const laylaAudio = document.getElementById("laylaAudio");
const freyaAudio = document.getElementById("freyaAudio");
const rafaelaAudio = document.getElementById("rafaelaAudio");

const laylaTarget = document.getElementById("laylaTarget");
const freyaTarget = document.getElementById("freyaTarget");
const rafaelaTarget = document.getElementById("rafaelaTarget");


/* LAYLA */

laylaTarget.addEventListener("targetFound",()=>{

laylaAudio.currentTime = 0;
laylaAudio.play();

showHero(
"LAYLA",
"Role: Marksman",
"Layla adalah penembak jitu yang menggunakan senjata energi raksasa untuk melindungi Land of Dawn. Semakin jauh jarak serangannya, semakin besar damage yang dapat diberikan kepada musuh."
);

});

laylaTarget.addEventListener("targetLost",()=>{

laylaAudio.pause();
hideHero();

});


/* FREYA */

freyaTarget.addEventListener("targetFound",()=>{

freyaAudio.currentTime = 0;
freyaAudio.play();

showHero(
"FREYA",
"Role: Fighter",
"Freya merupakan pejuang suci yang diberkati kekuatan para dewa. Dengan tombak dan perisainya, ia menjadi salah satu fighter yang tangguh dan memiliki daya tahan tinggi di medan pertempuran."
);

});

freyaTarget.addEventListener("targetLost",()=>{

freyaAudio.pause();
hideHero();

});


/* RAFAELA */

rafaelaTarget.addEventListener("targetFound",()=>{

rafaelaAudio.currentTime = 0;
rafaelaAudio.play();

showHero(
"RAFAELA",
"Role: Support",
"Rafaela adalah malaikat penjaga yang memiliki kemampuan penyembuhan dan perlindungan. Kehadirannya membantu rekan satu tim bertahan lebih lama dan menjaga keseimbangan dalam pertempuran."
);

});

rafaelaTarget.addEventListener("targetLost",()=>{

rafaelaAudio.pause();
hideHero();

});

});

</script>

</body>
</html>
